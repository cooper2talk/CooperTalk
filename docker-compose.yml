services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cooper2talk
      POSTGRES_USER: cooper
      POSTGRES_PASSWORD: cooper
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://cooper:cooper@postgres:5432/cooper2talk
    depends_on:
      - postgres
    ports:
      - "3000:3000"
volumes:
  postgres-data:
