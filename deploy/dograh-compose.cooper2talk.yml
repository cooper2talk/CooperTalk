services:
  api:
    environment:
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:?DEEPGRAM_API_KEY must be set}"
      GROQ_API_KEY: "${GROQ_API_KEY:?GROQ_API_KEY must be set}"
      GROQ_EXCELLINX_API_KEY: "${GROQ_EXCELLINX_API_KEY:-}"
      RUMIK_API_KEY: "${RUMIK_API_KEY:?RUMIK_API_KEY must be set}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must be set}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must be set}"
      TELNYX_API_KEY: "${TELNYX_API_KEY:-}"
      COOPER_EVENT_URL: "${COOPER_EVENT_URL:-}"
      COOPER_EVENT_SECRET: "${COOPER_EVENT_SECRET:-}"
      COOPER_COMPANION_PROFILES: "${COOPER_COMPANION_PROFILES:-}"
    # Keep the published image's service factory (which has no legacy Rumik
    # dependency), while mounting only Cooper's event, instruction, caller
    # profile, and Telnyx resolver code.
    volumes:
      - /opt/dograh/api/services/pipecat/run_pipeline.py:/app/api/services/pipecat/run_pipeline.py:ro
      - /opt/dograh/api/services/pipecat/event_handlers.py:/app/api/services/pipecat/event_handlers.py:ro
      - /opt/dograh/api/services/pipecat/transcript_log_coordinator.py:/app/api/services/pipecat/transcript_log_coordinator.py:ro
      - /opt/dograh/api/services/pipecat/cooper_events.py:/app/api/services/pipecat/cooper_events.py:ro
      - /opt/dograh/api/services/pipecat/operator_instructions.py:/app/api/services/pipecat/operator_instructions.py:ro
      - /opt/dograh/api/services/pipecat/cooper_companion_profiles.py:/app/api/services/pipecat/cooper_companion_profiles.py:ro
      - /opt/dograh/api/services/pipecat/cooper_web_research.py:/app/api/services/pipecat/cooper_web_research.py:ro
      - /opt/dograh/api/services/workflow/pipecat_engine.py:/app/api/services/workflow/pipecat_engine.py:ro
      - /opt/dograh/api/services/telephony/providers/telnyx/provider.py:/app/api/services/telephony/providers/telnyx/provider.py:ro
      - /opt/dograh/api/services/configuration/managed_env.py:/app/api/services/configuration/managed_env.py:ro
      - /opt/dograh/api/services/configuration/ai_model_configuration.py:/app/api/services/configuration/ai_model_configuration.py:ro
